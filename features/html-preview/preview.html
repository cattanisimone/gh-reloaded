<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>HTML preview</title>
    <link rel="stylesheet" href="preview.css" />
  </head>
  <body>
    <header class="ghhp-bar">
      <span id="path" class="ghhp-path"></span>
      <a id="source-link" class="ghhp-link" target="_blank" rel="noopener">View source on GitHub</a>
    </header>
    <div id="status" class="ghhp-status">Loading preview…</div>
    <iframe id="frame" class="ghhp-frame" sandbox="allow-scripts" title="HTML preview" hidden></iframe>
    <script src="preview.js"></script>
  </body>
</html>
