name: Release

# Release automation, in one workflow so a version is created and published
# together. On every push to main, Release Please reads the conventional
# commits since the last release and keeps a single release PR open that
# bumps manifest.json and updates CHANGELOG.md. Merging that release PR is
# itself a push to main: Release Please then creates the vX.Y.Z tag and the
# GitHub Release, and the publish job packages the extension, uploads it to
# the Chrome Web Store, and attaches the zip to that release. Keeping release
# creation and publishing here (rather than a separate workflow reacting to
# the tag) avoids two GitHub Releases for the same version.
#
# Recovery: release_created is true only on the run that cuts the release,
# so if packaging, the store upload, or the asset attach fails afterwards a
# plain re-run would skip publish and strand the version. The
# workflow_dispatch trigger below re-runs just the publish job against an
# already-created tag; the store upload republishes the same version and the
# asset attach clobbers any partial upload, so it is safe to run repeatedly.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_tag:
        description: "Re-package and publish an already-created release tag (e.g. v0.7.0), to recover from a failed publish."
        required: true
        type: string

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Release Please creates its `autorelease: *` labels on the first run;
      # creating repository labels needs the Issues permission.
      issues: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.created || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The release tag and version come from Release Please on the push that
      # cut the release, or from the manual input when recovering a publish.
      - name: Resolve the release tag and version
        id: rel
        env:
          DISPATCH_TAG: ${{ github.event.inputs.publish_tag }}
          RP_TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="$DISPATCH_TAG"
          else
            tag="$RP_TAG"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Package the released source, so a recovery run builds the same
          # tree the tag points at rather than the current tip of main.
          ref: ${{ steps.rel.outputs.tag }}

      - name: Package extension
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -r "dist/gh-reloaded-${{ steps.rel.outputs.version }}.zip" \
            manifest.json background.js background features icons lib options \
            -x "*.DS_Store"

      - name: Check Chrome Web Store credentials
        id: creds
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          if [ -n "$CHROME_EXTENSION_ID" ] && [ -n "$CHROME_PUBLISHER_ID" ] && [ -n "$CHROME_CLIENT_ID" ] && [ -n "$CHROME_CLIENT_SECRET" ] && [ -n "$CHROME_REFRESH_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Chrome Web Store secrets are not fully configured — created the GitHub Release only, skipped the store upload. See README's 'Releasing' section."
          fi

      # Requires the extension to already exist on the Chrome Web Store
      # (first submission has to go through the Developer Dashboard by hand —
      # Google doesn't let the API create a brand-new listing). See README.
      - name: Upload & publish to Chrome Web Store
        if: steps.creds.outputs.configured == 'true'
        uses: mnao305/chrome-extension-upload@v7.0.0
        with:
          file-path: dist/gh-reloaded-${{ steps.rel.outputs.version }}.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          publisher-id: ${{ secrets.CHROME_PUBLISHER_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: true

      - name: Attach the zip to the release
        # --clobber so a recovery run replaces a partially-uploaded asset
        # instead of failing because the name already exists.
        run: gh release upload "${{ steps.rel.outputs.tag }}" dist/*.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
