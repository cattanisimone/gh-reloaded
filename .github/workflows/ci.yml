name: CI

# Runs the unit + e2e test suites on every pull request, and on pushes to
# main. No GitHub token is involved — the e2e suite serves saved fixtures
# and mocks the GitHub API at the extension's boundary (see test/).
on:
  pull_request:
  push:
    branches: [main]

# A newer commit on the same branch/PR supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The e2e suite loads the extension in Chromium — only the full
      # build (channel "chromium") can do that headless, and --with-deps
      # pulls in the system libraries it needs on the runner.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run unit + e2e tests
        run: npm test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
