     header[role=banner]; a[aria-label=Homepage] containing svg.octicon-mark-github inside the flex row topRow__hash (the dot goes right after it).

  .logo__bX9RKh { display: inline-flex; width: 32px; height: 32px; align-items: center; justify-content: center; color: inherit; }

</style></head>
