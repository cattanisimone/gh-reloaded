<!doctype html>
<!--
  Fixture: github.com/notifications (the inbox list), fictional data, signed in as mira.
  Markup shape reported by the reviewer from a logged-in inbox (shape only, no data):
  li.notifications-list-item[data-notification-id] rows, unread class notification-unread,
  an ABSOLUTE subject href with ?notification_referrer_id=…&notifications_query=…, the
  reason as lowercase text, and a nav[aria-label="Pagination"]. No hashed CSS-module class
  is used or needed. The reason label sits in a leaf <span class="reason-label"> here; its
  real wrapper is UNVERIFIED (see the PR): the collector finds a known label by its text.
  Anchors to keep: meta[name="user-login"], the rows above, the pagination nav.

  Filter header (measured on the signed-in live inbox, structure and geometry only): a flex row
  d-flex flex-column flex-lg-row with NO gap, whose direct children are wrappers that space
  themselves with an 8px margin-left from the Primer lg breakpoint (1012px) and are full width,
  8px apart, below it: [All | Unread] [query input] [Sort by: …] [Group by: …] and an empty
  notification-recent-alerts node (0px). Below 1012px the Manage notifications / Inbox / Filter
  dropdowns stack above the input. The Primer pieces used here are inlined (a few utilities and the
  medium secondary Button) with Primer's own variable names, light and dark.

  Sidebar, rows and pagination (added for the Triage view, shape measured on the live inbox, no data):
  - sidebar: nav[aria-label="Notifications"] > nav[aria-label="Inbox"] (ActionList, items 33px high), hr, nav[aria-label="Filters"];
    shown from 768px and not rendered below it; its width follows the live one: 184px at 768 growing 0.25px per px to 245 at 1011,
    163px at 1012 growing 0.168px per px to 245 at 1500 (208 at 1280).
  - rows: div.js-check-all-container > div.Box > div.Box-body > ul.list-style-none.color-bg-subtle.js-navigation-container >
    li.notifications-list-item > div.d-flex (title link, note, AvatarStack) + ul.notification-list-item-actions +
    ul.notification-list-item-actions-responsive + tool-tip; rows are js-navigation-item.
  - pagination: div.paginate-container with Previous / Next.
  - the filter row spans the full width above the sidebar and the list (the sidebar's own placement is measured, the filter row's is kept as the #105 fixture had it).
  - below 768px the filter controls are inset from the column the list uses: at x=8 to w-8 under 544px (no page padding) and 8px inside a 16px page padding from 544px; Primer's base hr (1px muted bottom border, 15px margins) separates the sidebar groups.
  - the filter row lives INSIDE div.js-check-all-container, followed (live order) by div.js-bulk-action-toasts.tmp-mb-3 (0px high, 16px margin-bottom at every width), div.js-notifications-banners-target (0px), two absolute 1px div.sr-only (one on #done), then the list Box (on #done the .js-notifications-list blank state, 24px below the banners target). The row has margin-bottom 0 below 1012px and 16px from it; padding 0 8px below 544px.
  - variants by hash: #reason = Done/reason filter row (4 children, Sort by only, 4 rows: first four of the page), #done = the same row and 0 rows with the blank state, #many = 32 rows, #repo = Group by Repository (a Box per repository), #relative, #empty.

  One page, three routes (the tests serve it for every github.com navigation):
    /notifications …… the inbox (page 1; ?after=p2 is page 2; #relative = relative hrefs; #empty = no rows)
    /notifications/subscriptions …… the subscriptions page; it still carries rows, so a test can prove the
                                   engine's route gate and not the absence of rows
    anything else …… a repository page with a bell link that soft-navigates to the inbox (pushState + turbo:load)
-->
<html lang="en" data-color-mode="auto" data-light-theme="light" data-dark-theme="dark">
<head>
<meta charset="utf-8">
<meta name="user-login" content="mira">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notifications</title>
<style>
  :root { color-scheme: light dark; --bgColor-default: #fff; --bgColor-muted: #f6f8fa; --bgColor-neutral-muted: #818b981f; --borderColor-default: #d1d9e0; --borderColor-muted: #d1d9e0b3; --fgColor-default: #1f2328; --fgColor-muted: #59636e; --bgColor-accent-muted: #ddf4ff; --borderColor-accent-emphasis: #0969da; --fgColor-accent: #0969da; --bgColor-accent-emphasis: #0969da; --fgColor-onEmphasis: #fff; --shadow-floating-small: 0 0 0 1px #d1d9e0, 0 6px 12px -3px #25292e0a, 0 6px 18px 0 #25292e1f; }
  @media (prefers-color-scheme: dark) { :root { --bgColor-default: #0d1117; --bgColor-muted: #151b23; --bgColor-neutral-muted: #656c7633; --borderColor-default: #3d444d; --borderColor-muted: #3d444db3; --fgColor-default: #f0f6fc; --fgColor-muted: #9198a1; --bgColor-accent-muted: #388bfd1a; --borderColor-accent-emphasis: #1f6feb; --fgColor-accent: #4493f8; --bgColor-accent-emphasis: #1f6feb; --fgColor-onEmphasis: #fff; --shadow-floating-small: 0 0 0 1px #3d444d, 0 8px 16px -4px #01040966, 0 4px 32px -8px #01040966; } }
  .d-flex { display: flex; } .flex-column { flex-direction: column; } .flex-auto { flex: 1 1 auto; } .min-width-0 { min-width: 0; }
  /* tmp-mb-lg-3: no margin below 1012px, 16px from it (measured live). */
  .filters-row { margin-bottom: 0; }
  .tmp-mb-3 { margin-bottom: 16px; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  .js-bulk-action-toasts, .js-notifications-banners-target { height: 0; }
  .js-notifications-list { margin-top: 24px; padding: 32px 16px; border: 1px solid var(--borderColor-default); border-radius: 6px; text-align: center; }
  .filters-row > .f-item { width: 100%; margin-bottom: 8px; }
  .filters-row > .f-item.f-dd { display: block; }
  .filters-row > .f-item.f-dd-lg { display: block; }
  @media (min-width: 1012px) {
    .flex-lg-row { flex-direction: row; }
    .filters-row { margin-bottom: 16px; }
    .filters-row > .f-item { width: auto; flex-shrink: 0; margin-left: 8px; margin-bottom: 0; }
    .filters-row > .f-item.f-first { margin-left: 0; }
    .filters-row > .f-item.f-query { flex: 1 1 auto; min-width: 200px; flex-shrink: 1; }
    .filters-row > .f-item.f-dd { display: none; }
  }
  .filters-row input[type=search] { box-sizing: border-box; width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--borderColor-default); border-radius: 6px; background: var(--bgColor-default); color: var(--fgColor-default); font: inherit; }
  .BtnGroup { display: flex; } .BtnGroup .Button { border-radius: 0; margin-left: -1px; } .BtnGroup .Button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; } .BtnGroup .Button:last-child { border-radius: 0 6px 6px 0; }
  .Button { box-sizing: border-box; position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 4px; height: 32px; padding: 0 12px; border: 1px solid var(--borderColor-default); border-radius: 6px; font: inherit; font-size: 14px; font-weight: 500; line-height: 21px; cursor: pointer; white-space: nowrap; }
  .Button--secondary { background: var(--bgColor-muted); color: var(--fgColor-default); box-shadow: 0 1px 0 rgba(31,35,40,.04); transition: background-color .08s; }
  .Button--secondary:hover { background: var(--bgColor-neutral-muted); }
  .Button:focus-visible { outline: 2px solid #0969da; outline-offset: -2px; }
  .Button--medium { min-width: 0; } .Button-content, .Button-label { display: inline-flex; align-items: center; } .Button-trailingVisual { display: inline-flex; color: var(--fgColor-muted); }
  .filters-row .f-item > .Button { width: 100%; }
  @media (min-width: 1012px) { .filters-row .f-item > .Button { width: auto; } }
  notification-recent-alerts { display: block; width: 0; height: 0; }
  /* Global rules measured on the live inbox that reach an injected panel: the body font stack at 14px/21px, label 600, p with a bottom margin, h2 24px/36px. */
  body { margin: 0; font: 14px/21px "Mona Sans VF", -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; background: #fff; color: #1f2328; }
  label { font-weight: 600; font-size: 14px; line-height: 21px; display: inline; }
  p { margin: 0 0 10px; }
  h2 { font-size: 24px; line-height: 36px; font-weight: 600; }
  @media (prefers-color-scheme: dark) { body { background: #0d1117; color: #e6edf3; } a { color: #58a6ff; } }
  header { height: 64px; display: flex; align-items: center; gap: 16px; padding: 0 16px; border-bottom: 1px solid #d1d9e0; }
  main { max-width: 1280px; margin: 0 auto; padding: 24px 16px; }
  /* Below 768px the live page has no side padding under 544px and 16px from 544px, and the filter row insets its controls by 8px more. */
  @media (max-width: 543.98px) { main { padding-left: 0; padding-right: 0; } }
  @media (max-width: 543.98px) { .filters-row { padding: 0 8px; } }
  ul { list-style: none; margin: 0; padding: 0; }
  .layout { display: flex; gap: 24px; align-items: flex-start; }
  .layout > .sidebar { display: none; flex: none; width: calc(184px + (100vw - 768px) * 0.25); }
  @media (min-width: 768px) { .layout > .sidebar { display: block; } }
  @media (min-width: 1012px) { .layout > .sidebar { width: calc(163px + (100vw - 1012px) * 0.168); } }
  .layout > .content { flex: 1 1 auto; min-width: 0; }
  .sidebar nav[aria-label="Inbox"] a, .sidebar nav[aria-label="Filters"] a { display: flex; align-items: center; gap: 8px; box-sizing: border-box; height: 33px; padding: 0 8px; border-radius: 6px; color: inherit; text-decoration: none; }
  .sidebar nav a[aria-current="page"] { background: #818b9826; font-weight: 600; }
  /* Primer's base hr, as the live sidebar renders it between its groups: 1px muted bottom border, 15px margins. */
  hr { box-sizing: content-box; height: 0; margin: 15px 0; overflow: hidden; background: transparent; border: 0; border-bottom: 1px solid var(--borderColor-muted); }
  .Box { border: 1px solid #d1d9e0; border-radius: 6px; margin-bottom: 16px; overflow: hidden; }
  .Box-header { padding: 8px 16px; background: #f6f8fa; border-bottom: 1px solid #d1d9e0; font-weight: 600; }
  ul.color-bg-subtle { background: #f6f8fa; }
  li.notifications-list-item { display: block; padding: 8px 16px; border-top: 1px solid #d1d9e0; background: #fff; }
  li.notifications-list-item.notification-unread { background: #ddf4ff; }
  li.notifications-list-item:first-child { border-top: 0; }
  li.notifications-list-item > .d-flex { gap: 8px; align-items: center; }
  li.notifications-list-item .AvatarStack { margin-left: auto; display: inline-flex; gap: 2px; }
  li.notifications-list-item .AvatarStack i { width: 16px; height: 16px; border-radius: 50%; background: #d1d9e0; }
  ul.notification-list-item-actions, ul.notification-list-item-actions-responsive { display: flex; gap: 4px; margin-top: 4px; }
  ul.notification-list-item-actions-responsive { display: none; }
  li.notification-unread { font-weight: 600; }
  tool-tip { display: none; }
  @media (prefers-color-scheme: dark) { li.notifications-list-item { background: #0d1117; } li.notifications-list-item.notification-unread { background: #388bfd1a; } .Box, .Box-header { border-color: #3d444d; } .Box-header, ul.color-bg-subtle { background: #151b23; } }
  .reason-label { color: #59636e; }
  nav[aria-label="Pagination"] { display: flex; gap: 12px; padding: 12px 0; }
  .paginate-container { margin-top: 16px; }
</style>
</head>
<body>
<header><a href="/" id="logo">GitHub</a><a href="/notifications" id="bell" aria-label="Notifications">Inbox</a></header>
<main id="main"></main>
<script>
  const row = (id, href, title, repoLabel, reason, unread) =>
    '<li class="notifications-list-item js-navigation-item' + (unread ? ' notification-unread' : '') + '" data-notification-id="NT_' + id + '">' +
    '<div class="d-flex"><input type="checkbox" class="js-notifications-list-item-check" aria-label="Select ' + id + '">' +
    '<a class="notification-list-item-link" href="' + href + '"><p class="markdown-title" style="margin:0">' + title + '</p></a>' +
    '<span class="repo-ref">' + repoLabel + '</span><span class="reason-label">' + reason + '</span>' +
    '<span class="AvatarStack"><i></i><i></i></span></div>' +
    '<ul class="notification-list-item-actions"><li><button type="button" class="btn-sm" data-action="done">Done</button></li><li><button type="button" class="btn-sm" data-action="save">Save</button></li></ul>' +
    '<ul class="notification-list-item-actions-responsive"><li><button type="button" class="btn-sm" data-action="more">More</button></li></ul>' +
    '<tool-tip>Mark as done</tool-tip></li>';
  const abs = (path, id) => 'https://github.com' + path + '?notification_referrer_id=NT_' + id + '&notifications_query=is%3Aunread';
  // 32 rows: the reason follows the number so a test can compute the categories it expects.
  function manyRows(relative) {
    const reasons = ['review requested', 'mentioned', 'subscribed', 'commented', 'review requested', 'mentioned', 'ci activity', 'subscribed'];
    const out = [];
    for (let n = 1; n <= 32; n++) {
      const path = '/acme/web/pull/' + (100 + n);
      out.push(row(n, relative ? path : abs(path, n), 'Change number ' + n, 'acme/web #' + (100 + n), reasons[(n - 1) % 8], n % 3 !== 0));
    }
    return out;
  }
  function rows(page, relative) {
    if (location.hash === '#many' || location.hash === '#repo') return manyRows(relative);
    const href = (path, id) => (relative ? path : abs(path, id));
    if (page === 'p2') {
      return [
        row(7, href('/acme/web/pull/300', 7), 'Rework the cache', 'acme/web #300', 'review requested', true),
        row(8, href('/acme/web/issues/299', 8), 'Crash on empty list', 'acme/web #299', 'mentioned', true),
      ];
    }
    const first = location.hash === '#reason' ? 4 : 6;
    return [
      row(1, href('/acme/web/pull/412', 1), 'Add retry to uploads', 'acme/web #412', 'review requested', true),
      row(2, href('/acme/web/pull/409', 2), 'Fix the flaky spec', 'acme/web #409', 'mentioned', true),
      row(3, href('/acme/web/issues/401', 3), 'Docs typo', 'acme/web #401', 'commented', false),
      row(4, href('/acme/web/actions/runs/99', 4), 'CI: build failed', 'acme/web', 'ci activity', false),
      row(5, href('/acme/web/pull/390', 5), 'Bump the toolchain', 'acme/web #390', 'subscribed', false),
      row(6, href('/acme/web/pull/380', 6), 'Rename the helper', 'acme/web #380', 'review wanted', false),
].slice(0, first);
  }
  const caret = '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="m4.427 7.427 3.396 3.396a.25.25 0 0 0 .354 0l3.396-3.396A.25.25 0 0 0 11.396 7H4.604a.25.25 0 0 0-.177.427Z"/></svg>';
  const btn = (label, extra) => '<button type="button" class="Button Button--secondary Button--medium"' + (extra || '') + '><span class="Button-content"><span class="Button-label">' + label + '</span></span><span class="Button-visual Button-trailingVisual">' + caret + '</span></button>';
  const first = '<div class="f-item f-dd f-first">' + btn('Manage notifications') + '</div>' +
    '<div class="f-item f-first"><div class="BtnGroup"><button type="button" class="Button Button--secondary Button--medium">All</button><button type="button" class="Button Button--secondary Button--medium">Unread</button></div></div>' +
    '<div class="f-item f-query min-width-0"><input type="search" aria-label="Filter notifications" placeholder="Filter notifications"></div>' +
    '<div class="f-item" id="sort-wrap">' + btn('Sort by: Newest') + '</div>';
  // A: Inbox, 6 children (5 visible from 1012px) with Group by. B and C (reason filters, Done, Saved): 4 children (3 visible), Sort by only.
  const FILTERS_A = '<div class="filters-row d-flex flex-column flex-lg-row tmp-mb-lg-3 px-2" id="filters">' + first +
    '<div class="f-item" id="group-wrap">' + btn('Group by: Date') + '</div>' +
    '<notification-recent-alerts></notification-recent-alerts></div>';
  const FILTERS_B = '<div class="filters-row d-flex flex-column flex-lg-row tmp-mb-lg-3 px-2" id="filters">' + first + '</div>';
  function render() {
    const main = document.getElementById('main');
    const path = location.pathname.replace(/\/+$/, '');
    if (path === '/notifications' || path === '/notifications/subscriptions') {
      const done = location.hash === '#done';
      const reason = location.hash === '#reason' || done;
      const empty = location.hash === '#empty' || done;
      const page = new URLSearchParams(location.search).get('after') === 'p2' ? 'p2' : 'p1';
      const all = empty ? [] : rows(page, location.hash === '#relative');
      let list;
      if (done) {
        list = '<div class="js-notifications-list"><p>No notifications here.</p></div>';
      } else if (location.hash === '#repo') {
        const half = Math.ceil(all.length / 2);
        const box = (name, items) => '<div class="Box"><div class="Box-header">' + name + '</div><div class="Box-body"><ul class="list-style-none color-bg-subtle js-navigation-container">' + items.join('') + '</ul></div></div>';
        list = box('acme/web', all.slice(0, half)) + box('acme/api', all.slice(half));
      } else {
        list = '<div class="Box"><div class="Box-body"><ul class="list-style-none color-bg-subtle js-navigation-container">' + all.join('') + '</ul></div></div>';
      }
      const link = (label, current) => '<li><a href="/notifications"' + (current ? ' aria-current="page"' : '') + '>' + label + '</a></li>';
      const sidebar = '<div class="sidebar"><nav aria-label="Notifications"><nav aria-label="Inbox"><ul>' + link('Inbox', true) + link('Saved') + link('Done') + '</ul></nav><hr><nav aria-label="Filters"><ul>' + link('Assigned') + link('Participating') + '</ul></nav></nav></div>';
      main.innerHTML = '<h1>' + (path === '/notifications' ? 'Notifications' : 'Subscriptions') + '</h1>' +
        '<div class="layout">' + (path === '/notifications' ? sidebar : '') + '<div class="content">' +
        '<div class="js-check-all-container">' + (path === '/notifications' ? (reason ? FILTERS_B : FILTERS_A) : '') +
        '<div class="js-bulk-action-toasts tmp-mb-3"></div><div class="js-notifications-banners-target"></div>' +
        '<div class="sr-only"><label><input type="checkbox" class="js-check-all" aria-label="Select all"> Select all</label></div>' + (done ? '' : '<div class="sr-only" role="status"></div>') + list + '</div>' +
        '<div class="paginate-container"><nav aria-label="Pagination">' + (page === 'p1' ? '<a id="next" rel="next" href="/notifications?after=p2">Next</a>' : '<a id="prev" rel="prev" href="/notifications">Previous</a>') + '</nav></div></div></div>';
    } else {
      main.innerHTML = '<h1>acme/web</h1><p>Code · Issues · Pull requests</p>';
    }
  }
  // Soft navigation, like Turbo: no document load, turbo:before-cache on the
  // page being left (also from one inbox page to the next), history.pushState and turbo:load.
  document.addEventListener('click', (e) => {
    const a = e.target.closest('a#bell, a#next, a#prev');
    if (!a) return;
    e.preventDefault();
    document.dispatchEvent(new Event('turbo:before-cache'));
    history.pushState({}, '', a.getAttribute('href'));
    render();
    document.dispatchEvent(new Event('turbo:load'));
  });
  // GitHub's check-all selects EVERY checkbox of its container, seen or not.
  document.addEventListener('change', (e) => {
    if (!e.target.classList || !e.target.classList.contains('js-check-all')) return;
    document.querySelectorAll('.js-check-all-container .js-notifications-list-item-check').forEach((c) => (c.checked = e.target.checked));
  });
  window.addEventListener('popstate', render);
  render();
</script>
</body>
</html>
