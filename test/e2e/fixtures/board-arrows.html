<!--
  Fixture: GitHub Projects v2 "Board" view with dependency-arrow scenarios,
  at the spacing measured on the live public board github.com/orgs/github/projects/4247
  at 1500px: 350px column frames (1px border, #f6f8fa fill) with an 8px gap
  between them, 332px cards inside with 8px between cards, and each column
  scrolling on its own. Cards carry GitHub's un-hashed `board-view-column-card`
  class next to the hashed `CardBase__<hash>` one, `data-board-card-id`,
  `role="button"`, and a state icon with an aria-label. The view-tabs bar is
  copied from board.html. Scenarios (see board-dependencies.spec.js):
    #2 -> #8   same column, #7 sits between them
    #2 -> #3   adjacent columns
    #2 -> #4   Todo to Done, crossing In progress and Review
    #10 -> #9  Review to In progress (mixed: closed icon, open card)
    #4 -> #5   both closed by icon  (hidden)
    #11 -> #12 both closed by API state only, no icon (hidden)
-->
<!doctype html>

    <style>
      body { font-family: sans-serif; margin: 0; background: #fff; color: #1f2328; }
      [class*="topBarActions__"] { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 8px 16px; }
      [class*="ButtonGroup__"] { display: inline-flex; }
      [class*="ButtonGroup__"] button { height: 32px; }
      nav[aria-label="Select view"] { display: flex; align-items: center; padding: 4px 16px; border-bottom: 1px solid #d0d7de; }
      [role="tab"] { display: inline-flex; align-items: center; gap: 4px; padding: 6px 10px; }
      [class*="ViewNavigationContainer__"] { position: relative; display: block; }
      [class*="tabsContainer__"] { display: inline-block; }
      .boardContainer__xD7rX8 { display: flex; gap: 8px; padding: 16px; width: max-content; }
      [data-board-column] { box-sizing: border-box; width: 350px; padding: 8px; border: 1px solid #d1d9e0; border-radius: 6px; background: #f6f8fa; }
      [data-board-column] h3 { margin: 0 0 8px; font-size: 14px; }
      .column-drop-zone { display: flex; flex-direction: column; gap: 8px; height: 520px; overflow-y: auto; }
      .board-view-column-card { box-sizing: border-box; flex: none; width: 100%; padding: 12px; border: 1px solid #d1d9e0; border-radius: 6px; background: #fff; }
      .cardHeader { display: flex; gap: 8px; align-items: center; }
      .cardHeader a { color: inherit; text-decoration: none; }
      .repo { font-size: 12px; color: #59636e; margin-top: 4px; }
    </style>
  </head>
