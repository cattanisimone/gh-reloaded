<!doctype html>
<!-- Fixture: github.com's signed-in header on a repository page, two rows (global bar + repository tab bar), fictional repository acme/web.
     Reproduced from the geometry reported in #96 (the signed-in header cannot be opened anonymously, so it was not captured): 64px global bar + 36px tab bar.
     The top bar's actions row (topBarActions__hash) spaces its controls with an 8px gap; the search sits in a gap-less group (searchGroup__hash) joined to a second button,
     so the group is what the pill must go before. Anchors the GitHub Status feature uses: the logo link (aria-labelledby, octicon-mark-github), the search control (qbsearch-input / button named "search"). -->
<html lang="en" data-color-mode="light"><head><meta charset="utf-8"><title>acme/web</title>
<style>
  body { margin: 0; font: 14px/1.5 -apple-system, "Segoe UI", sans-serif; color: #1f2328; background: #fff; }
  .appHeader__k3j9a { background: #f6f8fa; border-bottom: 1px solid #d1d9e0; }
  .topBar__m2p4q { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 32px; padding: 16px 32px; }
  .topBarStart__r5t6u { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .topBarActions__h9k2 { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 0 1 auto; }
  .searchGroup__a1b2c { display: flex; align-items: center; gap: 0; min-width: 0; }
  .searchGroup__a1b2c .joined { margin-left: -1px; border-radius: 0 6px 6px 0; }
  .iconButton__d4e5f { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: 1px solid #d1d9e0; border-radius: 6px; background: #f6f8fa; padding: 0; box-sizing: border-box; }
  .logo__g7h8i { display: inline-flex; width: 32px; height: 32px; align-items: center; justify-content: center; color: inherit; }
  .context__j1k2l { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .search-input { display: block; }
  .search-button { display: inline-flex; align-items: center; gap: 8px; height: 32px; min-width: 0; width: 272px; padding: 0 12px; box-sizing: border-box; border: 1px solid #d1d9e0; border-radius: 6px 0 0 6px; background: #fff; font: inherit; color: #59636e; text-align: left; }
  .tabBar__n3o4p { display: flex; gap: 4px; height: 36px; padding: 0 32px; align-items: stretch; }
  .tabBar__n3o4p a { display: inline-flex; align-items: center; padding: 0 8px; color: inherit; text-decoration: none; }
  @media (max-width: 1012px) { .search-button { width: 160px; } }
  @media (max-width: 767px) {
    .topBar__m2p4q { padding: 16px; }
    .tabBar__n3o4p { padding: 0 16px; }
    .search-button { width: 32px; padding: 0; justify-content: center; border-radius: 6px 0 0 6px; }
    .search-button span { display: none; }
    .context__j1k2l { display: none; }
  }
</style></head>
<body>
  <header class="GlobalNav-module__root__x1y2z appHeader__k3j9a">
    <div class="topBar__m2p4q">
      <div class="topBarStart__r5t6u">
        <button type="button" class="iconButton__d4e5f" aria-label="Open global navigation menu">☰</button>
        <a class="logo__g7h8i" href="/" aria-labelledby="gh-logo-label" data-hotkey="g d"><span id="gh-logo-label" hidden>Homepage</span><svg class="octicon octicon-mark-github" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="currentColor"/></svg></a>
        <div class="context__j1k2l"><a href="/acme">acme</a><span>/</span><a href="/acme/web"><strong>web</strong></a></div>
      </div>
      <div class="topBarActions__h9k2">
        <div class="searchGroup__a1b2c">
          <qbsearch-input class="search-input"><button type="button" class="search-button" aria-label="Open quick search dialog, type / to search"><span>Type / to search</span></button></qbsearch-input>
          <button type="button" class="iconButton__d4e5f joined" aria-label="Open Copilot chat">✦</button>
        </div>
        <button type="button" class="iconButton__d4e5f" aria-label="Create new…">+</button>
        <a class="iconButton__d4e5f" href="/pulls" aria-label="Your pull requests">⇅</a>
        <button type="button" class="iconButton__d4e5f" aria-label="Open user navigation menu">M</button>
      </div>
    </div>
    <nav class="tabBar__n3o4p" aria-label="Repository"><a href="/acme/web">Code</a><a href="/acme/web/issues">Issues</a><a href="/acme/web/pulls">Pull requests</a><a href="/acme/web/actions" aria-current="page" style="border-bottom:2px solid #fd8c73">Actions</a></nav>
  </header>
  <main style="padding:24px 32px"><h1>acme/web</h1><p>Page content.</p></main>
</body></html>
