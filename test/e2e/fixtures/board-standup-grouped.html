<!--
  Fixture: GitHub Projects v2 "Board" (kanban) view, used by standup-mode.
  Same anchors as board-standup.html, but the board uses Group by: two horizontal sections repeat the same three columns. See fixtures/README.md for capture date and how to
  refresh. Hand-trimmed to the anchors the content scripts key on; the
  CSS-module class names keep GitHub's build-hash prefixes (matched by
  prefix in the content scripts) with the hashes dropped.
-->
<!doctype html>
<html lang="en" data-color-mode="light">
  <head>
    <meta charset="utf-8" />
    <title>Board · acme</title>
    <style>
      body { font-family: sans-serif; margin: 0; }
      .topBar { display: flex; justify-content: flex-end; gap: 8px; padding: 8px 16px; }
      .ButtonGroup { display: inline-flex; gap: 4px; }
      .ButtonGroup button { height: 28px; }
      nav[aria-label="Select view"] { display: flex; align-items: center; padding: 4px 16px; border-bottom: 1px solid #d0d7de; }
      [role="tab"] { display: inline-flex; align-items: center; gap: 4px; padding: 6px 10px; }
      .ViewNavigationContainer { position: relative; display: flex; align-items: center; flex: 1; }
      .boardContainer { padding: 16px; }
      .board-view-column { display: inline-block; vertical-align: top; width: 280px; margin-right: 24px; }
      .board-view-column-card { display: block; width: 240px; min-height: 72px; margin: 8px 0; padding: 12px; border: 1px solid #d0d7de; border-radius: 6px; }
      /* Filter row as on the live page (probed 2026-10-14): a flex region with
         gap 8px, the flexible filter box on the left, GitHub's own 32px Primer
         "View" button on the right. */
      [role="region"][aria-label="View filters"] { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 16px; }
      .toolbar { display: flex; align-items: center; gap: 8px; flex: 1 1 0; min-width: 0; }
      .toolbar input { flex: 1 1 auto; min-width: 0; max-width: 480px; height: 32px; }
      [class*="viewButtonContainer__"] button { box-sizing: border-box; height: 32px; padding: 0 12px; border: 1px solid #d1d9e0; border-radius: 6px; background: #f6f8fa; color: #1f2328; font-weight: 500; font-size: 14px; line-height: 21px; box-shadow: 0 1px 0 rgba(31,35,40,.04); cursor: pointer; }
      [class*="viewButtonContainer__"] button:hover { background: #eff2f5; }
      [class*="viewButtonContainer__"] button:active { background: #e6eaef; box-shadow: none; }
    </style>
  </head>
  <body>
    <main>
      <!-- View-tabs bar. The selected tab's octicon-project glyph is how
           both board features recognize a Board (vs Table/Roadmap). -->
      <div class="prc-PageLayout-index-module__topBarActions--ab12">
        <div class="prc-ButtonGroup-index-module__ButtonGroup--c1"><button>Insights</button><button>Workflows</button></div>
        <div class="prc-ButtonGroup-index-module__ButtonGroup--c2"><button>Project details</button><button>⋯</button></div>
      </div>

      <nav aria-label="Select view">
        <div class="ViewNavigationContainer__GbjBrL view-navigation-module__ViewNavigationContainer--v1">
          <div role="tab" aria-selected="true" class="selected">
            <svg class="octicon octicon-project" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect width="3" height="10" x="1" y="3"></rect><rect width="3" height="7" x="6" y="3"></rect><rect width="3" height="13" x="11" y="3"></rect></svg>
            <span>Board</span>
          </div>
        </div>
      </nav>

      <!-- Filter row, live markup: the region holds the filter box and the View button. -->
      <div role="region" aria-label="View filters" class="filterRow__Qx1">
        <div class="toolbar Box__Fk2">
          <input type="text" aria-label="Filter by keyword or by field" placeholder="Filter by keyword or by field" value="assignee:@me -status:Done" />
          <span>6 results</span>
          <button type="button" aria-label="Clear filter">Clear</button>
        </div>
        <div class="view-options viewButtonContainer__Zt3"><button type="button">View</button></div>
      </div>

      <!-- Board body. Three columns of issue cards (card discovery is just
           "any issue/PR link inside a .board-view-column-card"). Card #2
           carries a visible "P1" label, the DOM-only priority signal
           standup-mode reads when there is no token. -->
      <div class="boardContainer__xD7rX8">
        <div class="section">
        <div class="horizontalGroupHeader__g1h2J3">
          <button type="button" aria-label="Collapse group"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4"></path></svg><span class="prc-VisuallyHidden-VisuallyHidden-Q0qSB">Collapse group</span></button>
          <img class="avatar" alt="" width="20" height="20" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" />
          <span class="group-name">Alex Example</span>
          <span class="group-total">Effort: 3</span>
          <button type="button" aria-label="Group menu"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.5"></circle><circle cx="8" cy="8" r="1.5"></circle></svg></button>
        </div>
        <div class="board-view-column">
          <h3>Todo</h3>
        </div>
        <div class="board-view-column">
          <h3>In progress</h3>
          <div class="board-view-column-card"><a href="/acme/web/issues/11">Issue 11</a></div>
        </div>
        <div class="board-view-column">
          <h3>In review</h3>
          <div class="board-view-column-card"><a href="/acme/web/issues/12">Issue 12</a></div>
        </div>
        </div>
        <div class="section">
        <div class="board-view-column">
          <h3>Todo</h3>
          <div class="board-view-column-card"><a href="/acme/web/issues/21">Issue 21</a></div>
          <div class="board-view-column-card"><a href="/acme/web/issues/22">Issue 22</a></div>
          <div class="board-view-column-card"><a href="/acme/web/issues/23">Issue 23</a></div>
        </div>
        <div class="board-view-column">
          <h3>In progress</h3>
          <div class="board-view-column-card"><a href="/acme/web/issues/24">Issue 24</a></div>
        </div>
        <div class="board-view-column">
          <h3>In review</h3>
        </div>
        </div>
      </div>
    </main>
  </body>
</html>
