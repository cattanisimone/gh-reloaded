    <text x="433" y="198" fill="#e6edf3" font-size="9" font-weight="700" text-anchor="middle">5</text>
    <text x="292" y="216" fill="#e6edf3" font-size="11">Add OAuth callback</text>
    <text x="292" y="230" fill="#e6edf3" font-size="11">route</text>
