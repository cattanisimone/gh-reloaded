<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#6e7681"/>
    </marker>
    <marker id="arrow-crit" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#db6d28"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="460" fill="#0d1117"/>

  <!-- fake issue-page context above the injected panel -->
  <text x="24" y="34" fill="#e6edf3" font-size="16" font-weight="600">Sub-issues</text>
  <text x="1176" y="34" fill="#8b949e" font-size="13" text-anchor="end">2 of 4</text>
  <rect x="24" y="46" width="1152" height="1" fill="#21262d"/>

  <!-- injected panel: #ghdg-root -->
  <rect x="16" y="66" width="1168" height="374" rx="8" fill="#0d1117" stroke="#30363d"/>
  <line x1="16" y1="112" x2="1184" y2="112" stroke="#30363d"/>
  <text x="32" y="95" fill="#8b949e" font-size="11" font-weight="700" letter-spacing="0.6">DEPENDENCY GRAPH</text>

  <rect x="748" y="82" width="216" height="24" rx="5" fill="#161b22" stroke="#30363d"/>
  <text x="762" y="98" fill="#e6edf3" font-size="11">Pull toward dependents ▾</text>
  <rect x="976" y="82" width="176" height="24" rx="5" fill="#161b22" stroke="#30363d"/>
  <text x="990" y="98" fill="#e6edf3" font-size="11">Show external ▾</text>

  <!-- edges (drawn first, under nodes) -->
  <path d="M208,292 C244,292 244,212 280,212" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.75" marker-end="url(#arrow)"/>
  <path d="M448,212 L520,212" fill="none" stroke="#db6d28" stroke-width="2.5" marker-end="url(#arrow-crit)"/>
  <path d="M448,372 C484,372 484,212 520,212" fill="none" stroke="#6e7681" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M688,212 L760,260" fill="none" stroke="#db6d28" stroke-width="2.5" marker-end="url(#arrow-crit)"/>
  <path d="M688,372 C724,372 724,292 760,292" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.75" marker-end="url(#arrow)"/>

  <!-- N1: external, dimmed, dashed -->
  <g>
    <rect x="40" y="260" width="168" height="64" rx="6" fill="#12161c" stroke="#30363d" stroke-dasharray="4 3"/>
    <circle cx="55" cy="276" r="3.5" fill="#8b949e"/>
    <text x="64" y="280" fill="#8b949e" font-size="10" font-weight="600">#118</text>
    <text x="52" y="298" fill="#8b949e" font-size="11">Auth service</text>
    <text x="52" y="312" fill="#8b949e" font-size="11">rework</text>
  </g>

  <!-- N2: open -->
  <g>
    <rect x="280" y="180" width="168" height="64" rx="6" fill="#161b22" stroke="#30363d"/>
    <circle cx="295" cy="196" r="3.5" fill="#3fb950"/>
    <text x="304" y="200" fill="#8b949e" font-size="10" font-weight="600">#142</text>
