    <rect x="520" y="340" width="168" height="64" rx="6" fill="#12161c" stroke="#30363d" stroke-dasharray="4 3"/>
    <circle cx="535" cy="356" r="3.5" fill="#8b949e"/>
    <text x="544" y="360" fill="#8b949e" font-size="10" font-weight="600">#204</text>
    <text x="532" y="378" fill="#8b949e" font-size="11">Update mobile app</text>
  </g>

  <!-- N6: critical, open -->
  <g>
    <rect x="758" y="258" width="172" height="68" rx="7" fill="none" stroke="#db6d28" stroke-width="2"/>
    <rect x="760" y="260" width="168" height="64" rx="6" fill="#161b22" stroke="#30363d"/>
    <circle cx="775" cy="276" r="3.5" fill="#3fb950"/>
    <text x="784" y="280" fill="#8b949e" font-size="10" font-weight="600">#158</text>
    <rect x="904" y="268" width="18" height="14" rx="3" fill="#0d1117" fill-opacity="0.7" stroke="#ffffff" stroke-opacity="0.13"/>
    <text x="913" y="278" fill="#e6edf3" font-size="9" font-weight="700" text-anchor="middle">2</text>
    <text x="772" y="296" fill="#e6edf3" font-size="11">Ship auth v2</text>
    <text x="772" y="310" fill="#e6edf3" font-size="11">behind flag</text>
  </g>

  <!-- legend -->
  <g font-size="11" fill="#8b949e">
    <rect x="990" y="298" width="14" height="3" fill="#db6d28"/>
    <text x="1010" y="303">critical path</text>
    <rect x="990" y="318" width="14" height="0" stroke="#6e7681" stroke-width="1.5" stroke-dasharray="3 2"/>
    <line x1="990" y1="318" x2="1004" y2="318" stroke="#6e7681" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="1010" y="322">external dep.</text>
  </g>
