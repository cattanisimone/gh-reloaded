    <circle cx="295" cy="356" r="3.5" fill="#a371f7"/>
    <text x="304" y="360" fill="#8b949e" font-size="10" font-weight="600">#139</text>
    <rect x="424" y="348" width="18" height="14" rx="3" fill="#0d1117" fill-opacity="0.7" stroke="#ffffff" stroke-opacity="0.13"/>
    <text x="433" y="358" fill="#8b949e" font-size="9" font-weight="700" text-anchor="middle">3</text>
    <text x="292" y="376" fill="#8b949e" font-size="11">Write token refresh</text>
    <text x="292" y="390" fill="#8b949e" font-size="11">tests</text>
  </g>

  <!-- N4: critical, open -->
  <g>
    <rect x="518" y="178" width="172" height="68" rx="7" fill="none" stroke="#db6d28" stroke-width="2"/>
    <rect x="520" y="180" width="168" height="64" rx="6" fill="#161b22" stroke="#30363d"/>
    <circle cx="535" cy="196" r="3.5" fill="#3fb950"/>
    <text x="544" y="200" fill="#8b949e" font-size="10" font-weight="600">#151</text>
    <rect x="664" y="188" width="18" height="14" rx="3" fill="#0d1117" fill-opacity="0.7" stroke="#ffffff" stroke-opacity="0.13"/>
    <text x="673" y="198" fill="#e6edf3" font-size="9" font-weight="700" text-anchor="middle">8</text>
    <text x="532" y="216" fill="#e6edf3" font-size="11">Wire login UI to</text>
    <text x="532" y="230" fill="#e6edf3" font-size="11">new auth flow</text>
    <rect x="532" y="236" width="60" height="14" rx="3" fill="#0d1117" fill-opacity="0.7" stroke="#ffffff" stroke-opacity="0.13"/>
    <text x="562" y="246" fill="#8b949e" font-size="9" text-anchor="middle">Platform</text>
  </g>

  <!-- N5: external, dimmed, dashed -->
