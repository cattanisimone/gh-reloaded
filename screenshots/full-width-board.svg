<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="fw-tick" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M4,0 L4,8" stroke="#6e7681" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="520" fill="#0d1117"/>

  <!-- ===== BEFORE ===== -->
  <text x="20" y="24" fill="#8b949e" font-size="11" font-weight="700" letter-spacing="0.6">BEFORE — CENTERED, PADDED COLUMN</text>

  <!-- page frame -->
  <rect x="0" y="40" width="1200" height="180" fill="#010409"/>
  <!-- board container, squeezed into the page's centered column -->
  <rect x="150" y="56" width="900" height="148" rx="6" fill="#0d1117" stroke="#21262d"/>

  <g font-size="11" fill="#8b949e">
    <text x="168" y="76">Backlog</text>
    <text x="388" y="76">In Progress</text>
    <text x="608" y="76">In Review</text>
    <text x="828" y="76">Done</text>
  </g>
  <g fill="#161b22" stroke="#30363d">
    <rect x="166" y="84" width="204" height="24" rx="4"/>
    <rect x="166" y="114" width="204" height="24" rx="4"/>
    <rect x="386" y="84" width="204" height="24" rx="4"/>
    <rect x="386" y="114" width="204" height="24" rx="4"/>
    <rect x="606" y="84" width="204" height="24" rx="4"/>
    <rect x="606" y="114" width="204" height="24" rx="4"/>
    <rect x="826" y="84" width="204" height="24" rx="4"/>
    <rect x="826" y="114" width="204" height="24" rx="4"/>
  </g>
  <!-- horizontal-scroll hint -->
  <rect x="500" y="188" width="200" height="5" rx="2.5" fill="#30363d"/>

  <!-- unused margin callouts -->
  <line x1="24" y1="128" x2="138" y2="128" stroke="#6e7681" stroke-width="1.2" marker-start="url(#fw-tick)" marker-end="url(#fw-tick)"/>
  <text x="81" y="146" fill="#6e7681" font-size="10" text-anchor="middle">unused margin</text>
  <line x1="1062" y1="128" x2="1176" y2="128" stroke="#6e7681" stroke-width="1.2" marker-start="url(#fw-tick)" marker-end="url(#fw-tick)"/>
  <text x="1119" y="146" fill="#6e7681" font-size="10" text-anchor="middle">unused margin</text>

  <line x1="0" y1="240" x2="1200" y2="240" stroke="#21262d"/>

  <!-- ===== AFTER ===== -->
  <text x="20" y="266" fill="#db6d28" font-size="11" font-weight="700" letter-spacing="0.6">AFTER — FULL-WIDTH BOARD</text>

  <rect x="0" y="282" width="1200" height="180" fill="#010409"/>
  <rect x="20" y="298" width="1160" height="148" rx="6" fill="#0d1117" stroke="#21262d"/>

  <g font-size="11" fill="#8b949e">
    <text x="38" y="318">Backlog</text>
    <text x="323" y="318">In Progress</text>
    <text x="608" y="318">In Review</text>
    <text x="893" y="318">Done</text>
  </g>
  <g fill="#161b22" stroke="#30363d">
    <rect x="36" y="326" width="269" height="24" rx="4"/>
    <rect x="36" y="356" width="269" height="24" rx="4"/>
    <rect x="321" y="326" width="269" height="24" rx="4"/>
    <rect x="321" y="356" width="269" height="24" rx="4"/>
    <rect x="606" y="326" width="269" height="24" rx="4"/>
    <rect x="606" y="356" width="269" height="24" rx="4"/>
    <rect x="891" y="326" width="269" height="24" rx="4"/>
    <rect x="891" y="356" width="269" height="24" rx="4"/>
  </g>

  <text x="600" y="494" fill="#8b949e" font-size="12" text-anchor="middle">Same viewport, no horizontal scrollbar — every column gets the freed-up margin space</text>
</svg>
