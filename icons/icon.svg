<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <rect x="4" y="4" width="120" height="120" rx="26" fill="#0d1117"/>
  <rect x="4" y="4" width="120" height="120" rx="26" fill="none" stroke="#30363d" stroke-width="3"/>

  <!-- git branch/fork glyph: generic "this is a git/GitHub tool", not tied
       to any one specific feature. Kept to 3 shapes total so it still
       reads at 16px. -->
  <path d="M 40 96 L 40 32" fill="none" stroke="#c9d1d9" stroke-width="10" stroke-linecap="round"/>
  <path d="M 40 64 C 40 48, 54 40, 70 40 L 90 40" fill="none" stroke="#c9d1d9" stroke-width="10" stroke-linecap="round"/>

  <circle cx="40" cy="96" r="14" fill="#21262d" stroke="#8b949e" stroke-width="5"/>
  <circle cx="40" cy="32" r="14" fill="#21262d" stroke="#8b949e" stroke-width="5"/>
  <circle cx="90" cy="40" r="15" fill="#21262d" stroke="#e0823d" stroke-width="6"/>
  <circle cx="90" cy="40" r="5" fill="#e0823d"/>
</svg>
